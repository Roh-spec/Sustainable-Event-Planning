services:
  # ==========================================
  # 1. FastAPI Application Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: esc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sustainable_events
      - ENVIRONMENT=development
      - PYTHONPATH=/workspace
    depends_on:
      - db
    volumes:
      - .:/workspace

  # ==========================================
  # 2. React + Vite Frontend Web App
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esc_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ==========================================
  # 3. PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: esc_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sustainable_events
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
    name: esc_postgres_data
