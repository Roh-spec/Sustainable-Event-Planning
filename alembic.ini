# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = database/migrations

# Template used to generate migration file names; The default value is --autogenerate
file_template = %%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults
# to database/migrations/versions. When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator"
version_locations = database/migrations/versions

# Version path separator; As mentioned above, this is the character used to split
# version_locations. Valid values are 'os', 'space', 'newline'. Defaults to 'os'.
version_path_separator = os

# The output encoding used when revisions are generated
# output_encoding = utf-8

# SQLAlchemy URL is dynamically read from backend.app.core.config.settings in env.py
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/sustainable_events

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
