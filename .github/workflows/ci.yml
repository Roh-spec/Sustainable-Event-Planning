name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX_MAIN_JS_KB: 250
  MAX_CSS_KB: 70

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sustainable_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest tests -q

      - name: Run database migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sustainable_events
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Verify baseline assumptions seeded
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sustainable_events
          PYTHONPATH: .
        run: |
          python -c "from backend.app.core.database import SessionLocal; from backend.app.models.assumption import Assumption; db = SessionLocal(); count = db.query(Assumption).count(); db.close(); print(f'Baseline assumptions count: {count}'); assert count > 0, 'No assumptions found in database'"

      - name: Start FastAPI backend and test health endpoint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sustainable_events
          PYTHONPATH: .
        run: |
          python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "Started FastAPI server with PID $SERVER_PID"
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "FastAPI health check passed at attempt $i!"
              kill $SERVER_PID
              exit 0
            fi
            echo "Waiting for FastAPI server ($i/30)..."
            sleep 1
          done
          echo "FastAPI health check timed out after 30 seconds"
          kill $SERVER_PID || true
          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run WCAG AA contrast check
        working-directory: frontend
        run: npm run check:contrast

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Check bundle budgets
        working-directory: frontend
        run: |
          JS_FILE=$(ls -S dist/assets/index-*.js 2>/dev/null | head -n 1)
          if [ -z "$JS_FILE" ]; then
            echo "Error: No main JS chunk dist/assets/index-*.js found"
            exit 1
          fi
          JS_BYTES=$(wc -c < "$JS_FILE")
          JS_KB=$(( JS_BYTES / 1024 ))
          echo "Main JS chunk: $JS_FILE ($JS_KB KB, raw $JS_BYTES bytes)"
          if [ "$JS_KB" -gt "$MAX_MAIN_JS_KB" ]; then
            echo "ERROR: Main JS bundle exceeds budget of ${MAX_MAIN_JS_KB} KB (actual: ${JS_KB} KB)"
            exit 1
          fi

          CSS_FILE=$(ls -S dist/assets/index-*.css 2>/dev/null | head -n 1)
          if [ -z "$CSS_FILE" ]; then
            echo "Error: No main CSS chunk dist/assets/index-*.css found"
            exit 1
          fi
          CSS_BYTES=$(wc -c < "$CSS_FILE")
          CSS_KB=$(( CSS_BYTES / 1024 ))
          echo "Main CSS chunk: $CSS_FILE ($CSS_KB KB, raw $CSS_BYTES bytes)"
          if [ "$CSS_KB" -gt "$MAX_CSS_KB" ]; then
            echo "ERROR: Main CSS bundle exceeds budget of ${MAX_CSS_KB} KB (actual: ${CSS_KB} KB)"
            exit 1
          fi
          echo "Bundle budget checks passed (JS: ${JS_KB} KB <= ${MAX_MAIN_JS_KB} KB, CSS: ${CSS_KB} KB <= ${MAX_CSS_KB} KB)"

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 120); do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "Backend became healthy at attempt $i!"
              exit 0
            fi
            echo "Waiting for backend health endpoint ($i/120)..."
            sleep 1
          done
          echo "Backend failed to become healthy within 120 seconds"
          exit 1

      - name: Verify frontend dev server is reachable
        run: curl -s -f http://localhost:5173 > /dev/null

      - name: Output container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
